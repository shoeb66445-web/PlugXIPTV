plugins { id 'com.android.application' }
android {
  namespace 'app.plugxaura.iptv'
  compileSdk 35
  defaultConfig {
    applicationId 'app.plugxaura.iptv'
    minSdk 21
    targetSdk 35
    versionCode 4
    versionName '1.0.3'
    multiDexEnabled true
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
  buildFeatures { buildConfig true }
  signingConfigs {
    release {
      storeFile file('plugx-release.p12')
      storePassword 'y-5CnpXFQlasePmj_1EljSyaJfMLcCNROD-B9qIZc5WwrGSI'
      keyAlias 'plugxiptv'
      keyPassword 'y-5CnpXFQlasePmj_1EljSyaJfMLcCNROD-B9qIZc5WwrGSI'
      storeType 'PKCS12'
      v1SigningEnabled true
      v2SigningEnabled true
    }
  }
  buildTypes {
    debug {
      signingConfig signingConfigs.release
      minifyEnabled false
      debuggable false
    }
    release {
      signingConfig signingConfigs.release
      minifyEnabled false
      debuggable false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro'
    }
  }
}
dependencies {
  implementation 'androidx.appcompat:appcompat:1.6.1'
  implementation 'androidx.recyclerview:recyclerview:1.3.1'
  implementation 'androidx.media3:media3-exoplayer:1.3.1'
  implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
  implementation 'androidx.media3:media3-exoplayer-dash:1.3.1'
  implementation 'androidx.media3:media3-exoplayer-smoothstreaming:1.3.1'
  implementation 'androidx.media3:media3-ui:1.3.1'
  implementation 'androidx.media3:media3-datasource-okhttp:1.3.1'
  implementation 'com.google.code.gson:gson:2.10.1'
  implementation 'com.squareup.okhttp3:okhttp:4.11.0'
  implementation 'androidx.multidex:multidex:2.0.1'
}
